<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Prompt Organizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🧠 AI Prompt Organizer</h1>
    <button onclick="toggleTheme()">🌓 Toggle Theme</button>

    <input type="text" id="title" placeholder="Prompt Title" />
    <div class="category-container">
      <select id="category">
        <option value="Essay">Essay</option>
        <option value="Coding">Coding</option>
        <option value="Image Gen">Image Gen</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" id="newCategory" placeholder="Or enter new category" />
    </div>
    <textarea id="content" placeholder="Enter your prompt here..." rows="4"></textarea>
    <button onclick="savePrompt()">Save Prompt</button>

    <hr>
    <div class="search-container">
      <input type="text" id="search" placeholder="🔎 Search prompts..." oninput="searchPrompts()" />
    </div>
    <div class="filters">
      <label for="filter">Filter by category:</label>
      <select id="filter" onchange="renderPrompts()">
        <option value="All">All</option>
        <option value="Essay">Essay</option>
        <option value="Coding">Coding</option>
        <option value="Image Gen">Image Gen</option>
        <option value="Other">Other</option>
      </select>
      <button onclick="toggleFavoritesFilter()" id="favoritesFilter">⭐ Favorites</button>
      <button onclick="toggleArchivedFilter()" id="archivedFilter">📦 Archived</button>
    </div>

    <button onclick="exportPrompts()">📄 Export to TXT</button>

    <div id="promptList"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
